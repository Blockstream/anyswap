[workspace]
members = [
    "crates/core",
    "crates/sdk",
    "crates/sdk-wasm",
]
resolver = "3"

[workspace.package]
version = "1.11.0"
license = "MIT"
repository = "https://github.com/Blockstream/anyswap"
rust-version = "1.91"

[workspace.dependencies]
anyswap-core = { path = "crates/core", version = "~1.11.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
serde_json = "1.0"
serde_with = "3"
bitcoin = { version = "0.32", features = ["serde", "rand-std", "base64"] }
elements = { version = "0.27", features = ["serde"] }
thiserror = "2"
uuid = { version = "1.23", features = ["v4", "v5", "js", "serde"] }
bip39 = { version = "2", features = ["rand", "zeroize"] }
zeroize = "1"
lightning-invoice = "0.34"
proptest = "1.12"
strum ={ version = "0.26", features = ["derive"] }
hex = "0.4"
tracing = "0.1"
utoipa = { version = "6.0", features = ["uuid"] }
esplora-client = { version = "0.12", default-features = false, features = ["async-https-rustls", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
